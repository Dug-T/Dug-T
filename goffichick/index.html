<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Goffichick</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Metal+Mania&display=swap" rel="stylesheet">
<style>
  :root { --bg: #07030a; --pink: #ff4fb8; }
  /* Pin the page in place and turn off browser swipe / pull / bounce gestures, so in-app
     browsers (Facebook, Instagram...) don't treat looking around as "swipe to close". */
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  body { position: fixed; inset: 0; }
  #screen, #touch, #touch * { touch-action: none; }
  body { display: flex; align-items: center; justify-content: center; }
  #screen { display: block; cursor: crosshair; } /* the game sizes the canvas to fill the screen */
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #touch { display: none; position: absolute; inset: 0; pointer-events: none; }
  #touch > * { pointer-events: auto; position: absolute; }
  #look { right: 0; top: 0; width: 60%; height: 100%; }
  #stick { left: max(40px, env(safe-area-inset-left, 0px)); bottom: 22px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,79,184,0.12); border: 2px solid rgba(255,79,184,0.45); }
  #knob { position: absolute; left: 35px; top: 35px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,79,184,0.5); pointer-events: none; }
  .btn { width: 64px; height: 64px; border-radius: 50%; border: 2px solid rgba(255,79,184,0.6); background: rgba(20,0,20,0.45); color: #ffd0ec; font: bold 12px monospace; display: flex; align-items: center; justify-content: center; }
  #bFire { right: 22px; bottom: 30px; width: 84px; height: 84px; background: rgba(255,45,149,0.35); font-size: 14px; }
  /* a second FIRE button up and to the right of the move stick, for the left thumb (aim with the right) */
  #bFire2 { left: max(170px, calc(env(safe-area-inset-left, 0px) + 130px)); bottom: 138px; width: 70px; height: 70px; background: rgba(255,45,149,0.35); font-size: 13px; }
  #bJump { right: 28px; bottom: 128px; width: 56px; height: 56px; }
  #bWpn { right: 92px; bottom: 152px; width: 54px; height: 54px; }
  #bUse { right: 166px; bottom: 156px; width: 56px; height: 56px; }
  #bNade { right: 232px; bottom: 156px; width: 56px; height: 56px; font-size: 11px; }
  #bMap { right: 16px; top: 16px; width: 48px; height: 48px; font-size: 10px; }
  #bPause { right: 72px; top: 16px; width: 48px; height: 48px; font-size: 13px; }
  /* the right-hand stick aims: left/right turns, up/down looks up and down */
  #rstick { right: 146px; bottom: 22px; width: 120px; height: 120px; border-radius: 50%; background: rgba(60,220,255,0.10); border: 2px solid rgba(60,220,255,0.5); }
  #rknob { position: absolute; left: 35px; top: 35px; width: 50px; height: 50px; border-radius: 50%; background: rgba(60,220,255,0.45); pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
<canvas id="screen" width="480" height="270"></canvas>
<div id="touch">
  <div id="look"></div>
  <div id="stick"><div id="knob"></div></div>
  <div id="rstick"><div id="rknob"></div></div>
  <div class="btn" id="bFire">FIRE</div>
  <div class="btn" id="bFire2">FIRE</div>
  <div class="btn" id="bUse">USE</div>
  <div class="btn" id="bWpn">WPN</div>
  <div class="btn" id="bMap">MAP</div>
  <div class="btn" id="bJump">JUMP</div>
  <div class="btn" id="bNade">NADE</div>
  <div class="btn" id="bPause">II</div>
</div>
</div>
<!-- goffichick-build: bump the ?v= numbers below on every release so phones never mix a new page with old scripts -->
<script src="js/photo-data.js?v=20261117n"></script>
<script src="js/audio.js?v=20261117n"></script>
<script src="js/textures.js?v=20261117n"></script>
<script src="js/sprites.js?v=20261117n"></script>
<script src="js/weapons.js?v=20261117n"></script>
<script src="js/levels.js?v=20261117n"></script>
<script src="js/editor.js?v=20261117n"></script>
<script src="js/voice.js?v=20261117n"></script>
<script src="js/leaderboard.js?v=20261117n"></script>
<script src="js/net.js?v=20261117n"></script>
<script src="js/game.js?v=20261117n"></script>
</body>
</html>
