<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Goffichick</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Metal+Mania&display=swap" rel="stylesheet">
<style>
  :root { --bg: #07030a; --pink: #ff4fb8; }
  /* Pin the page in place and turn off browser swipe / pull / bounce gestures, so in-app
     browsers (Facebook, Instagram...) don't treat looking around as "swipe to close". */
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  body { position: fixed; inset: 0; }
  #screen, #touch, #touch * { touch-action: none; }
  body { display: flex; align-items: center; justify-content: center; }
  #screen { display: block; cursor: crosshair; } /* the game sizes the canvas to fill the screen */
  #touch { display: none; position: fixed; inset: 0; pointer-events: none; }
  #touch > * { pointer-events: auto; position: absolute; }
  #look { right: 0; top: 0; width: 60%; height: 100%; }
  #stick { left: max(40px, env(safe-area-inset-left, 0px)); bottom: 22px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,79,184,0.12); border: 2px solid rgba(255,79,184,0.45); }
  #knob { position: absolute; left: 35px; top: 35px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,79,184,0.5); pointer-events: none; }
  .btn { width: 64px; height: 64px; border-radius: 50%; border: 2px solid rgba(255,79,184,0.6); background: rgba(20,0,20,0.45); color: #ffd0ec; font: bold 12px monospace; display: flex; align-items: center; justify-content: center; }
  #bFire { right: 22px; bottom: 30px; width: 84px; height: 84px; background: rgba(255,45,149,0.35); font-size: 14px; }
  #bUse { right: 120px; bottom: 22px; }
  #bWpn { right: 26px; bottom: 128px; }
  #bMap { right: 16px; top: 16px; width: 48px; height: 48px; font-size: 10px; }
</style>
</head>
<body>
<canvas id="screen" width="480" height="270"></canvas>
<div id="touch">
  <div id="look"></div>
  <div id="stick"><div id="knob"></div></div>
  <div class="btn" id="bFire">FIRE</div>
  <div class="btn" id="bUse">USE</div>
  <div class="btn" id="bWpn">WPN</div>
  <div class="btn" id="bMap">MAP</div>
</div>
<script src="js/photo-data.js"></script>
<script src="js/audio.js"></script>
<script src="js/textures.js"></script>
<script src="js/sprites.js"></script>
<script src="js/weapons.js"></script>
<script src="js/levels.js"></script>
<script src="js/game.js"></script>
</body>
</html>
