<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>WallyMan World</title>
<style>
  :root { --bg: #000; --btn: transparent; --btn-on: rgba(255,224,64,0.35); --ink: #fff; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: monospace; color: var(--ink); }
  @media (orientation: portrait) { body.touch { justify-content: flex-start; padding-top: 32px; } }
  #screen { image-rendering: pixelated; image-rendering: crisp-edges; background: #000; display: block; }
  #pad { display: none; }
  body.touch #pad { display: flex; position: fixed; left: 0; right: 0; bottom: calc(110px + env(safe-area-inset-bottom, 0px)); justify-content: space-between; align-items: flex-end; padding: 16px; box-sizing: border-box; pointer-events: none; }
  #pad .grp { display: flex; gap: 10px; align-items: flex-end; pointer-events: auto; }
  #pad button { opacity: var(--o, 0.3); transition: opacity 0.08s; -webkit-tap-highlight-color: transparent; }
  #pad button.on { opacity: calc(var(--o, 0.3) + 0.3); }
  #stickBase { display: none; position: fixed; z-index: 5; border-radius: 50%; border: 2px solid rgba(255,255,255,0.45); background: radial-gradient(circle, rgba(255,255,255,0.10), rgba(255,255,255,0.03)); pointer-events: none; box-sizing: border-box; }
  #stickBase.on { border-color: rgba(255,255,255,0.7); }
  #stickKnob { position: absolute; left: 30%; top: 30%; width: 40%; height: 40%; border-radius: 50%; background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.75), rgba(160,190,255,0.45)); border: 2px solid rgba(255,255,255,0.8); box-sizing: border-box; }
  body.analog.touch #stickBase { display: block; }
  body.analog #pad .dpad button { opacity: 0 !important; }
  body.touch.tablet #pad button { width: 84px; height: 84px; font-size: 22px; }
  body.touch.tablet #pad button.small { width: 76px; height: 44px; border-radius: 22px; font-size: 13px; }
  body.touch.tablet #pad button[data-k="special"] { width: 64px !important; height: 52px !important; border-radius: 26px !important; font-size: 17px !important; }
  body.touch.tablet #pad .dpad { grid-template-columns: 72px 72px 72px; grid-template-rows: 72px 72px; gap: 6px; }
  body.touch.tablet #pad .dpad button { width: 72px; height: 72px; }
  body.onehand-right #pad, body.onehand-left #pad { flex-direction: column; justify-content: flex-end; gap: 12px; }
  body.onehand-right #pad { align-items: flex-end; } body.onehand-left #pad { align-items: flex-start; }
  @media (orientation: landscape) { body.onehand-left #pad .dpad, body.onehand-right #pad .dpad { grid-template-columns: 40px 40px 40px; grid-template-rows: 40px 40px; } body.onehand-left #pad .dpad button, body.onehand-right #pad .dpad button { width: 40px; height: 40px; } }
  #pad button { width: 64px; height: 64px; border-radius: 50%; border: 2px solid #fff; background: var(--btn); text-shadow: 0 0 2px #000; color: var(--ink); font: bold 18px monospace; touch-action: none; }
  #pad button.on { background: var(--btn-on); }
  #pad button.small { width: 56px; height: 34px; border-radius: 17px; font-size: 11px; }
  #pad .dpad { display: grid; grid-template-columns: 56px 56px 56px; grid-template-rows: 56px 56px; gap: 4px; }
  #pad .dpad button { width: 56px; height: 56px; border-radius: 12px; }
  /* landscape: the picture fills the height, the d-pad and buttons sit in the side margins, START in a corner */
  @media (orientation: landscape) {
    body.touch #pad { bottom: calc(10px + env(safe-area-inset-bottom, 0px)); padding: 10px max(14px, env(safe-area-inset-right, 0px)) 10px max(14px, env(safe-area-inset-left, 0px)); }
    body.touch #pad > .grp:nth-child(2) { position: fixed; top: calc(8px + env(safe-area-inset-top, 0px)); left: max(10px, env(safe-area-inset-left, 0px)); }
  }
  @media (orientation: landscape) and (max-height: 500px) {
    body.touch #pad .dpad { grid-template-columns: 48px 48px 48px; grid-template-rows: 48px 48px; }
    body.touch #pad .dpad button { width: 48px; height: 48px; }
  }
  /* portrait: a tip to turn sideways, with a full-screen button */
  #turnHint { display: none; position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; height: 30px; align-items: center; justify-content: center; gap: 8px; font: bold 11px monospace; color: #ffe040; background: rgba(16,24,72,0.85); z-index: 40; }
  #turnHint button { font: bold 11px monospace; color: #fff; background: #2f62d0; border: 1px solid #fff; border-radius: 6px; padding: 3px 8px; }
  @media (orientation: portrait) { body.touch #turnHint { display: flex; } }
  body.nohint #turnHint, body.fs #turnHint { display: none !important; }
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#101848">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<body>
<canvas id="screen" width="256" height="224"></canvas>
<div id="turnHint"><span>&#8635; TURN SIDEWAYS FOR A BIGGER SCREEN</span><button id="fsBtn">FULL SCREEN</button><button id="hintX" aria-label="Hide">&#10005;</button></div>
<div id="pad">
  <div class="grp dpad">
    <span></span><button data-k="up">&#9650;</button><span></span>
    <button data-k="left">&#9664;</button><button data-k="down">&#9660;</button><button data-k="right">&#9654;</button>
  </div>
  <div class="grp" style="flex-direction:column;align-items:center">
    <button class="small" data-k="start">START</button>
  </div>
  <div class="grp">
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
      <button class="small" data-k="special" style="width:48px;height:40px;border-radius:20px;font-size:14px">S</button>
      <button data-k="run">B</button>
    </div>
    <button data-k="jump" style="margin-bottom:28px">A</button>
  </div>
</div>
